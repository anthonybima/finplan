# Push to main → build the FinPlan image → ghcr.io/<owner>/finplan:latest.
# The VPS runs Watchtower, which pulls the new image within ~5 minutes: the live site updates itself.
name: Build & publish
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  packages: write
jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: VITE_GOOGLE_CLIENT_ID=${{ vars.VITE_GOOGLE_CLIENT_ID }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/finplan:latest
            ghcr.io/${{ github.repository_owner }}/finplan:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
