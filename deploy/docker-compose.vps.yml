# FinPlan on a VPS (Hostinger Docker manager): HTTPS site + automatic updates from GitHub.
# Uses the stock caddy image; deploy/run.sh (from the `site` branch) downloads the latest build,
# serves it, and checks for a new build every 5 minutes.
services:
  finplan:
    image: caddy:2-alpine
    restart: unless-stopped
    ports: ["80:80", "443:443", "443:443/udp"]
    environment:
      SITE_ADDRESS: finplan.bimabearing.cloud
    entrypoint: ["/bin/sh", "-c", "wget -qO /run.sh https://raw.githubusercontent.com/anthonybima/finplan/site/run.sh && exec sh /run.sh"]
    volumes:
      - caddy_data:/data
      - caddy_config:/config
volumes:
  caddy_data:
  caddy_config:
